type PaginationMeta {
  total: Int!
  page: Int!
  limit: Int!
  totalPages: Int!
}

type TeacherList {
  data: [Teacher!]!
  meta: PaginationMeta!
}

input CreateTeacherInput {
  firstname: String!
  lastname: String!
  email: String
  phoneNumber: String
  diploma: String
  specialization: String!
  classIds: [String!]
}

type StudentList {
  data: [Student!]!
  meta: PaginationMeta!
}

type ClassList {
  data: [Classe!]!
  meta: PaginationMeta!
}


