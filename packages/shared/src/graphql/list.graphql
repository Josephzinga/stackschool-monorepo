type PaginationMeta {
  total: Int!
  page: Int!
  limit: Int!
  totalPages: Int!
}

type TeacherList {
  data: [Teacher!]!
  meta: PaginationMeta!
}

scalar DateTime

input UpdateLessonInput {
  id: ID!
  startTime: DateTime!
  endTime: DateTime!
  classId: ID
  day: Day!
}
type ApiResponse {
  ok: Boolean
  message: String
  details: [String]
}
enum Gender {
  MALE
  FEMALE
}
input CreateStudentInput {
  firstname: String!
  lastname: String!
  email: String
  phoneNumber: String
  gender: Gender!
  classId: ID!
  matricule: String!
  birthDate: DateTime
  birthPlace: DateTime
  enrollmentYear: String
  nationality: String
  enrollmentDate: DateTime
  previousClass: String
  studentNumber: Int
  address: String
  bloodGroup: String
  birthCertificateNumber: String
  medicalCondition: String
  allergies: String
  parentData: UpdateStudentParentData
  transportMode: TransportMode
  previousSchool: String
  status: StudentStatus
}
enum UpdateMode {
  CREATE
  CONNECT
}
input UpdateStudentParentData {
  mode: UpdateMode
  parentId: ID
  newParent: CreateParentInput
}
input CreateParentInput {
  firstname: String!
  lastname: String!
  phoneNumber: String!
  address: String
  profession: String!
  relationType: String!
}

input CreateTeacherInput {
  firstname: String!
  lastname: String!
  email: String
  phoneNumber: String
  gender: Gender!
  diploma: String
  specialization: String!
  classIds: [String!]
}

input CreateClassInput {
  section: String
  name: String!
  level: String!
  supervisorId: String
}

input GetSchoolParentsInput {
  page: Int! = 0
  limit: Int! = 10
  searchTerm: String
}

type ParentList {
  data: [Parent!]
  meta: PaginationMeta
}

type StudentList {
  data: [Student!]
  meta: PaginationMeta!
}

type ClassList {
  data: [Class!]!
  meta: PaginationMeta!
}
input GetSubjectInput {
  page: Int! = 0
  limit: Int! = 10
  searchTerm: String
  sort: SubjectSortInput
  classId: ID
  teacherId: ID
}
type SubjectList {
  data: [Subject!]!
  meta: PaginationMeta!
}
