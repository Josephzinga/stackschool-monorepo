query GetAdminDashboardStats($schoolId: ID!) {
  school(schoolId: $schoolId) {
    id
    name
    logo
    stats {
      totalStudents
      totalTeachers
      totalClasses

      monthlyRevenue {
        previousMonth
        currentMonth
      }
      pendingPaymentsCount

      attendance {
        rate
        presentCount
        absentCount
        totalExpected
        lateCount
        history {
          date
          rate
          present
          absent
          late
        }
      }

      studentGender {
        male
        female
      }

      classesOccupancy {
        className
        studentCount
      }

      enrollmentPerMonth {
        month
        count
      }
    }
  }
}

query GetDashboardContext($input: SchoolId!) {
  me {
    schoolContext(schoolId: $input) {
      id
      role
      schoolUserPermissions {
        id
        permission {
          id
          code
          name
          description
          module
        }
      }
      teacher {
        id
        department
        specialization
        supervisedClasses {
          id
          section
          section
        }
      }
      staff {
        id
        position
        departement
        schoolUserId
      }
      parent {
        id
        isDelegate
        parentStudent {
          student {
            id
            user {
              id
              profile {
                lastname
                firstname
                photo
              }
            }
            matricule
          }
        }
      }
      student {
        id
        user {
          id
          profile {
            id
            firstname
            lastname
            photo
          }
        }
        matricule
      }
    }
  }
}

query GetSchoolSettings($schoolId: ID!) {
  school(schoolId: $schoolId) {
    settings {
      id
      startHour
      endHour
      daysOfWeek
      lessonDuration
    }
  }
}
