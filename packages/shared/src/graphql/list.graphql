type PaginationMeta {
  total: Int!
  page: Int!
  limit: Int!
  totalPages: Int!
}

type TeacherList {
  data: [Teacher!]!
  meta: PaginationMeta!
}

scalar DateTime
scalar Date


type ApiResponse {
  ok: Boolean
  message: String
  details: [String]
}
enum Gender {
  MALE
  FEMALE
}
enum ResourceMode {
  TEACHER
  CLASS
}
input CreateStudentInput {
  firstname: String!
  lastname: String!
  email: String
  phoneNumber: String
  gender: Gender!
  classId: ID!
  matricule: String!
  birthDate: DateTime
  birthPlace: DateTime
  enrollmentYear: String
  nationality: String
  enrollmentDate: DateTime
  previousClass: String
  studentNumber: Int
  address: String
  bloodGroup: String
  birthCertificateNumber: String
  medicalCondition: String
  allergies: String
  parentData: UpdateStudentParentData
  transportMode: TransportMode
  previousSchool: String
  status: StudentStatus
}

input UpdateStudentParentData {
  mode: UpdateMode
  parentId: ID
  newParent: CreateParentInput
}
input CreateParentInput {
  firstname: String!
  lastname: String!
  phoneNumber: String!
  isDelegate: Boolean
  email: String
  address: String!
  profession: String!
  children: [ParentStudentInput!]
}
input ParentStudentInput {
  id: ID!
  relationType: RelationType!

}
type ClassAndSubject {
  classes: [Class!]
  subjects: [Subject!]
}

type LessonsData {
  events: [LessonsEvents!]
  resources: [LessonResources!]
}
type LessonsList {
  data: LessonsData!
  meta: PaginationMeta
}
type LessonResources {
  id: ID!
  title: String!
  weeklyHours: Int
}
type LessonsEvents {
  id: ID!
  resourceId: ID
  title: String!
  startTime: String!
  endTime: String!
  day: Day!
  status: LessonStatus
  subject: Subject!
  group: Group
  teacher: LessonTeacher
  room: Room
}

type LessonTeacher {
  id: ID!
  firstname: String!
  lastname: String!
  weeklyHours: Float
}

input CreateTeacherInput {
  firstname: String!
  lastname: String!
  email: String
  phoneNumber: String
  gender: Gender!
  diploma: String
  specialization: String!
}

input CreateClassInput {
  section: String
  name: String!
  level: String!
  supervisorId: String
}

input GetSchoolParentsInput {
  page: Int! = 0
  limit: Int! = 10
  searchTerm: String
  studentId: String
}

type ParentList {
  data: [Parent!]
  meta: PaginationMeta
}

type StudentList {
  data: [Student!]
  meta: PaginationMeta!
}

type ClassList {
  data: [Class!]
  meta: PaginationMeta!
}

type SubjectList {
  data: [Subject!]!
  meta: PaginationMeta!
}
type SearchClassesAndSubjects {
  searchClasses(search: String, limit: Int): [Class]
  searchSubjects(search: String, limit: Int, classId: ID): [Subject]
}
