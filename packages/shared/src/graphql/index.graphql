type Mutation {
  confirmCompleteProfile: UserPayload
  createListTeachers(data: CreateTeacherInput, schoolId: ID!): ApiResponse
  updateTeacher(
    teacherId: ID!
    data: CreateTeacherInput!
    schoolId: ID!
  ): ApiResponse
  deleteTeachers(
    teacherIds: [ID!]!
    schoolId: ID!
    soft: Boolean = true
  ): ApiResponse
  deleteStudents(
    studentIds: [ID!]!
    schoolId: ID!
    soft: Boolean = true
  ): ApiResponse
  createListStudent(data: CreateStudentInput!, schoolId: ID!): ApiResponse
  updateStudent(
    studentId: ID!
    data: CreateStudentInput!
    schoolId: ID!
  ): Student
  createClass(data: CreateClassInput!): Class!
  updateClass(data: CreateClassInput!, schoolId: ID!, classId: ID!): ApiResponse
  deleteClasses(classIds: [ID!]!, schoolId: ID!): ApiResponse
  createSubject(input: CreateSubjectInput!): Subject
  deleteSubjects(subjectIds: [ID!]!): ApiResponse
  createClassSubject(input: ClassSubjectInput): ClassSubject!
  updateClassSubject(input: ClassSubjectInput): ClassSubject!
  deleteClassSubjects(ids: [ID!]!): ApiResponse

  createLesson(input: CreateLessonInput!): Lesson
  updateLessonStatus(status: LessonStatus!, id: ID!): Lesson
  updateLesson(input: UpdateLessonInput!): Lesson
  deleteLesson(id: ID!): ApiResponse

  createRoom(input: CreateRoomInput!): Room!
  updateRoom(input: CreateRoomInput!): Room!
  createGroup(input: CreateGroupInput!): Group!
}

type ClassTeacher {
  schoolId: ID
  teacher: [Teacher]
  class: [Class]
}

type Query {
  searchStudent(filter: StudentSearchInput!): [Student]
  searchSchool(filter: SchoolSearchInput!): [School!]
  getClassAndSubjects(filter: StudentSearchInput): [Class]
  me: User
  school(schoolId: ID!): School!
  verifyInvitationCode(code: InvitationCodeInput!): User
  getLessons(filter: GetLessonsInput!): LessonsList
  getClassTeacher: ClassTeacher
  teacher(id: ID!): Teacher
  student(id: ID!): Student
  class(id: ID!): Class
  getSchoolTeachers(input: GetSchoolTeachersInput): TeacherList!
  getSchoolStudents(input: GetSchoolStudentsInput!, schoolId: ID!): StudentList!
  getSchoolClasses(input: GetSchoolClassesInput!): ClassList!
  getSchoolSubjects(input: GetSubjectInput!): SubjectList
  getClassSubjects(classId: ID, teacherId: ID, groupId: ID): [ClassSubject!]
  getSchoolRooms(filter: GetSchoolRoomInput!): RoomList!
  getSchoolParents(filter: GetSchoolParentsInput): ParentList
}

input CreateLessonInput {
  day: Day!
  mode: CreateLessonMode!
  startTime: DateTime!
  endTime: DateTime!
  subjectId: ID!
  teacherId: ID
  groupId: ID
}
enum CreateLessonMode {
  TEACHER
  CLASS
}

input GetLessonsInput {
  groupId: ID
  teacherId: ID
  classId: ID
  searchTerm: String
  department: String
  mode: CreateLessonMode!
  hasLessonOnly: Boolean = true
  section: String
  level: String
  limit: Int! = 6
  page: Int! = 0
}
type LessonsData {
  events: LessonsEvents!
  resources: LessonResources
}
type LessonsList {
  data: LessonsData!
  meta: PaginationMeta
}
type LessonResources {
  id: ID!
  title: String!
}
type LessonsEvents {
  id: ID!
  resourceId: ID
  title: String!
  startTime: String!
  endTime: String!
  status: LessonStatus
  subject: Subject!
  group: Group
  teacher: Teacher
  room: Room

}

