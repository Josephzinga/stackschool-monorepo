type Teacher @key(fields: "id") {
  id: ID!
  assignments: [TeacherAssignment]
  supervisedClasses: [Class]
}
type Student @key(fields: "id classId") {
  id: ID!
  classId: ID!
  schoolClass: Class
}

type SchoolStats @key(fields: "id") {
  id: ID!
  totalClasses: Int!
  classesOccupancy: [ClassStats]
}

type ClassStats @key(fields: "className") {
  className: String!
  studentCount: Int!
}
