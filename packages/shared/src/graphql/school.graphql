type Student {
  id: ID!
  matricule: String!
  birthDate: DateTime
  birthPlace: DateTime
  schoolUserId: ID
  enrollmentDate: DateTime
  previousClass: String
  studentNumber: Int

  bloodGroup: String
  birthCertificateNumber: String
  medicalCondition: String
  allergies: String
  attendances(date: Date): [AttendanceRecord!]

  transportMode: TransportMode
  previousSchool: String
  enrollmentYear: String!
  status: StudentStatus
  disciplinaryActions: StudentDisciplinaryAction
  nationality: String
  schoolClass: Class
  classId: ID
  profileId: ID
  profile: Profile
  parentStudent: [ParentStudent]
  user: User
}

type StudentDisciplinaryAction {
  id: String
  studentId: ID
  type: DisciplinaryType
  reason: String
  startDate: DateTime
  endDate: DateTime
}

type School {
  id: ID
  name: String!
  slug: String
  address: String!
  code: String
  logo: String
  stats: SchoolStats
  settings: SchoolSettings
  teachers: [Teacher]
  lessons: [Lesson]
}

type SchoolSettings {
  id: ID
  schoolId: ID
  lessonDuration: Int
  startHour: Int
  endHour: Int
  daysOfWeek: [Day]
}

type Subject {
  id: ID!
  name: String!
  code: String
  category: SubjectCategory
  totalWeeklyHours: Float
  mainTeacherId: ID
  mainTeacher: Teacher
  classSubject: [ClassSubject]
}
type Room {
  id: ID!
  name: String!
  code: String
  capacity: Int
  type: String
  class: [Class]
  defaultForClass: Class
}

type ClassSubject {
  id: ID!
  coefficient: Int
  weeklyHours: Float
  teacherId: ID
  subjectId: ID
  groupId: ID!
  subject: Subject!
  assignment: TeacherAssignments
  group: Group!
  assessments: [Assessment!]
}
type Parent {
  id: ID!
  profession: String
  isDelegate: Boolean
  parentStudent: [ParentStudent]
  schoolUserId: ID
  user: User
}

type ParentStudent {
  relationType: RelationType
  student: Student
  studentId: ID
  parentId: ID
  parent: Parent
}
type Assessment {
  id: ID!
  type: AssessmentType
  description: String
  status: AssessmentStatus
  weight: Float
  maxScore: Float
}
type Lesson {
  id: ID!
  title: String
  startTime: DateTime
  endTime: DateTime
  day: Day
  teacherAssignmentId: ID!
  teacherAssignment: TeacherAssignments
  status: LessonStatus!
  room: Room
}
type ClassTeacher {
  schoolId: ID
  teacher: [Teacher]
  groups: [Group!]
  classes: [Class]
}
type TeacherAssignments {
  id: ID!
  teacher: Teacher
  teacherId: ID!
  classSubjectId: ID!
  classSubjects: ClassSubject
  lessons: [Lesson!]
  schoolId: ID
}
type Teacher {
  id: ID!
  schoolUserId: ID
  diploma: String
  experience: String
  hireDate: DateTime
  isActive: Boolean
  bio: String
  salary: Float
  department: String
  specialization: String
  assignments: [TeacherAssignments]
  supervisedClasses: [Class]
  createdAt: DateTime
  updatedAt: DateTime
  attendances(date: Date): [AttendanceRecord!]
  weeklyHours: Float
  classesCount: Int
  user: User
}

type Staff {
  id: ID!
  schoolUserId: String!
  position: String!
  hireDate: DateTime
  salary: Float
  departement: String
}

type TeachingTeamMember {
  teacher: Teacher!
  assignments: [SubjectAssignments!]!
}
type SubjectAssignments {
  id: ID!
  subject: Subject!
}
type Class {
  id: ID!
  name: String!
  level: String!
  section: String
  students: [Student!]
  defaultRoom: Room
  groupId: ID!
  group: Group
  teachingTeamMembers: [TeachingTeamMember!]
  supervisor: Teacher
  _count: ClassCount
  totalCoefficient: Int
  totalWeeklyHours: Float
}

enum GroupType {
  SOLO
  MULTIPLE
}
type Group {
  id: ID!
  name: String!
  type: GroupType
  classes: [Class!]!
  classSubjects: [ClassSubject]
}

type ClassCount {
  students: GenderStats
  teachers: Int
  subjects: Int
}

type GenderStats {
  male: Int!
  female: Int!
}

type MonthlyStats {
  month: String!
  count: Int!
}

type ClassStats {
  className: String!
  studentCount: Int!
}

type DailyAttendance {
  date: String!
  rate: Float!
  present: Int!
  absent: Int!
  late: Int!
}

type MonthlyRevenue {
  currentMonth: Float!
  previousMonth: Float
}

type AttendanceStats {
  rate: Float!
  presentCount: Int!
  absentCount: Int!
  lateCount: Int!
  totalExpected: Int!
  history: [DailyAttendance!]
}

type SchoolStats {
  # KPI Cards
  totalStudents: Int!
  totalTeachers: Int!
  totalClasses: Int!

  # Finance & Présence
  monthlyRevenue: MonthlyRevenue
  pendingPaymentsCount: Int

  # Remplacé par un objet complexe
  attendance: AttendanceStats

  # Charts Data
  studentGender: GenderStats
  enrollmentPerMonth: [MonthlyStats!]
  classesOccupancy: [ClassStats!]
}

input StudentSortInput {
  field: StudentSortField
  order: SortOrder
}
input SubjectSortInput {
  field: SubjectSortField
  order: SortOrder
}
input GetSchoolStudentsInput {
  page: Int! = 0
  limit: Int! = 10

  teacherId: String
  sort: StudentSortInput
  classId: ID
  searchTerm: String
  level: String
  section: String
}
input CreateSubjectInput {
  name: String!
  code: String!
  mainTeacherId: ID
  category: SubjectCategory!
  classSubject: [ClassSubjectInput!]
}

input CreateRoomInput {
  id: ID
  name: String!
  capacity: Int
  type: String
  code: String
  defaultClassId: String
}

input CreateGroupInput {
  name: String!
  classIds: [ID!]!
}

input ClassSubjectInput {
  id: ID
  teacherId: ID
  groupId: ID
  classId: ID
  subjectId: ID!
  coefficient: Int!
  weeklyHours: Float
}

type RoomList {
  data: [Room]!
  meta: PaginationMeta
}
