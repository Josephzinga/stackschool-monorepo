query SearchStudent($input: StudentSearchInput!) {
  searchStudent(filter: $input) {
    id
    user {
      profile {
        firstname
        lastname
        photo
      }
    }
    schoolClass {
      name
    }
    matricule
  }
}

query SearchSchool($input: SchoolSearchInput!) {
  searchSchool(filter: $input) {
    id
    name
    address
    code
    logo
  }
}

mutation ConfirmCompleteProfile {
  confirmCompleteProfile {
    ok
    message
    user {
      id
      email
      profileCompleted
      hasMembership
    }
  }
}
