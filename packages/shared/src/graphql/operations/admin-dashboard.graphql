query GetAdminDashboardStats($schoolId: SchoolId) {
  schoolStats(schoolId: $schoolId) {
    id
    name
    logo
    stats {
      totalStudents
      totalTeachers
      totalClasses

      monthlyRevenue {
        previousMonth
        currentMonth
      }
      pendingPaymentsCount

      attendance {
        rate
        presentCount
        absentCount
        totalExpected
        lateCount
        history {
          date
          rate
          present
          absent
          late
        }
      }

      studentGender {
        male
        female
      }

      classesOccupancy {
        className
        studentCount
      }

      enrollmentPerMonth {
        month
        count
      }
    }
  }
}
