type User @key(fields: "id") {
  id: ID!
  email: String
  username: String
  phoneNumber: String
  profileCompleted: Boolean
  hasMembership: Boolean
  profile: Profile
  isActive: Boolean
  accounts: [Account]
}

type Account @key(fields: "id") {
  id: ID!
  provider: String
  userId: ID
}

type Profile @key(fields: "id") {
  id: ID!
  firstName: String!
  lastName: String!
  avatarUrl: String
  gender: Gender
  address: String
}
