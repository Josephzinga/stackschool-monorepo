type TeacherAssignments @key(fields: "id") {
  id: ID!
  teacher: Teacher
  teacherId: ID!
  classSubjectId: ID!
  classSubjects: ClassSubject
  lessons: [Lesson!]
  schoolId: ID
}
type Teacher @key(fields: "id") {
  id: ID!
  schoolUserId: ID
  diploma: String
  experience: String
  hireDate: DateTime
  isActive: Boolean
  bio: String
  salary: Float
  department: String
  specialization: String
  assignments: [TeacherAssignments]
  supervisedClasses: [Class]
  createdAt: DateTime
  updatedAt: DateTime
  attendances(date: Date): [AttendanceRecord!]
  weeklyHours: Float
  classesCount: Int
  user: User
}

input CreateTeacherInput {
  firstName: String!
  lastName: String!
  email: String
  phoneNumber: String
  gender: Gender!
  diploma: String
  specialization: String!
}
type TeacherList {
  data: [Teacher!]!
  meta: PaginationMeta!
}

input GetSchoolTeachersInput {
  page: Int! = 0
  limit: Int! = 10
  searchTerm: String

  classId: ID
  subjectId: ID
  isActive: Boolean
  isSupervisor: Boolean

  day: Day
}

input CreateTeacherAssignmentInput {
  classId: ID!
  subjectIds: [ID!]!
  teacherId: ID!
}
type TeacherTodaySubject {
  teachers: Teacher
  classes: ClassLessons
}
