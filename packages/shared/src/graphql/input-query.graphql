input GetLessonsInput {
  groupId: ID
  teacherId: ID
  classId: ID
  searchTerm: String
  department: String
  mode: ResourceMode!
  hasLessonOnly: Boolean = true
  section: String
  status: LessonStatus
  level: String
  limit: Int! = 6
  page: Int! = 0
}

input GetSubjectInput {
  page: Int! = 0
