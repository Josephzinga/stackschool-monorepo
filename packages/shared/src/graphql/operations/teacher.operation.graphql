query GetSchoolTeachers($input: GetSchoolTeachersInput!) {
  getSchoolTeachers(input: $input) {
    meta {
      limit
      total
      totalPages
    }
    data {
      ...TeacherListData
    }
  }
}
query GetTeacherOptions($input: GetSchoolTeachersInput!) {
  getSchoolTeachers(input: $input) {
    data {
      id
      user {
        profile {
          firstname
          lastname
        }
      }
    }
  }
}

query GetTeacherSchedule($id: ID!) {
  teacher(id: $id) {
    assignments {
      classSubjects {
        group {
          id
          type
          name
          classes {
            id
            name
          }
        }
        subject {
          id
          name
        }
      }
      lessons {
        id
        endTime
        startTime
        status
        day
      }
    }
  }
}

query GetTeacherDetails($id: ID!) {
  teacher(id: $id) {
    id
    specialization
    diploma
    experience
    bio
    hireDate
    salary
    department
    weeklyHours
    isActive
    createdAt
    classesCount
    user {
      id
      email
      phoneNumber
      profile {
        firstname
        lastname
        photo
        gender
        address
      }
    }
  }
}

mutation DeleteTeachers($teacherIds: [ID!]!, $soft: Boolean) {
  deleteTeachers(teacherIds: $teacherIds, soft: $soft) {
    ok
    message
  }
}

query GetTeacherAssignment($id: ID!) {
  getAssignments(filter: { teacherId: $id }) {
    classSubjects {
      id
      group {
        classes {
          id
          name
        }
      }
      subject {
        id
        name
        code
      }
    }
  }
}

mutation CreateTeacher($input: CreateTeacherInput!) {
  createTeacher(input: $input) {
    ...TeacherListData
  }
}
mutation CreateTeacherAssignment($input: CreateTeacherAssignmentInput!) {
  createTeacherAssignment(input: $input) {
    ok
    message
    details
  }
}

mutation SyncTeacherAssignment($input: CreateTeacherAssignmentInput!) {
  syncTeacherAssignment(input: $input) {
    ok
    message
    details
  }
}
fragment TeacherListData on Teacher {
  id
  schoolUserId
  supervisedClasses {
    id
    name
    level
  }
  weeklyHours
  specialization
  diploma
  department
  experience
  isActive
  user {
    email
    phoneNumber
    profile {
      firstname
      lastname
      photo
      gender
    }
  }
  assignments {
    classSubjects {
      group {
        type
        classes {
          id
          name
        }
      }
      subject {
        id
        name
      }
    }
  }
}

mutation UpdateTeacher($teacherId: ID!, $data: CreateTeacherInput!) {
  updateTeacher(teacherId: $teacherId, data: $data) {
    ...TeacherListData
  }
}
