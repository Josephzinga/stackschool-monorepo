type Query {
  getClassSubjects(
    classId: ID
    teacherId: ID
    groupId: ID
    searchTerm: String
  ): [ClassSubject!]
  class(id: ID!): Class

  getSchoolClasses(input: GetSchoolClassesInput!): ClassList!
  getLessons(filter: GetLessonsInput!): LessonsList
  getSchoolSubjects(input: GetSubjectInput!): SubjectList
  getSchoolRooms(filter: GetSchoolRoomInput!): RoomList!
  getAssignments(filter: GetAssignmentInput!): [TeacherAssignments!]
}
