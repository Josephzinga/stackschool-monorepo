query GetSchoolParents($filter: GetSchoolParentsInput!) {
  getSchoolParents(filter: $filter) {
    meta {
      page
      total
      totalPages
      limit
    }
    data {
      ...ParentList
    }
  }
}

mutation CreateParent($input: CreateParentInput!) {
  createParent(input: $input) {
    ...ParentList
  }
}


fragment ParentList on Parent {
  id
  profession
  user {
    id
    phoneNumber
    email
    isActive
    profile {
      id
      firstname
      lastname
      address
      photo
    }
  }

  parentStudent {
    student {
      id
      user {
        profile {
          firstname
          lastname
        }
      }
      schoolClass {
        id
        name
        level
      }
    }
  }
}
