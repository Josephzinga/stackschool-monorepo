query GetSchoolSubjects($input: GetSubjectInput!) {
  getSchoolSubjects(input: $input) {
    meta {
      page
      totalPages
      total
      limit
    }

    data {
      id
      name
      code
      category
      totalWeeklyHours
      mainTeacher {
        id
        user {
          ...UserProfile
        }
      }
      classSubject {
        id
        group {
          classes {
            id
            name
            level
            section
          }
        }
      }
    }
  }
}

query GetSubjects($input: GetSubjectInput!) {
  getSchoolSubjects(input: $input) {
    data {
      id
      name
      code
    }
  }
}

query GetClassSubjectOptions($classId: ID, $teacherId: ID, $groupId: ID) {
  getClassSubjects(classId: $classId, teacherId: $teacherId, groupId: $groupId) {
    id
    teacher {
      id
      user {
        profile {
          firstname
          lastname
        }
      }
    }
    group {
      id
      name
      type
      classes {
        id
        name
      }
    }
    subject {
      id
      name
    }
  }
}

mutation CreateSubject($input: CreateSubjectInput!) {
  createSubject(input: $input) {
    id
    name
    code
    totalWeeklyHours
    mainTeacher {
      id
      user {
        ...UserProfile
      }
    }
    classSubject {
      id
      group {
        classes {
          id
          name
          level
        }
      }
      teacher {
        id
        user {
          ...UserProfile
        }
      }
    }
  }
}

mutation DeleteSubjects($subjectIds: [ID!]!) {
  deleteSubjects(subjectIds: $subjectIds) {
    ok
    message
  }
}
