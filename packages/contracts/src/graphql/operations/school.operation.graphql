query SearchSchool($input: SchoolSearchInput!) {
  searchSchool(filter: $input) {
    id
    name
    address
    code
    logo
  }
}
query SearchStudent($input: StudentSearchInput!) {
  searchStudent(filter: $input) {
    id
    schoolUser {
      user {
        profile {
          firstName
          lastName
          avatarUrl
        }
      }
    }
    schoolClass {
      name
    }
    matricule
  }
}

query GetSchoolSettings($schoolId: ID!) {
  school(schoolId: $schoolId) {
    settings {
      id
      startHour
      endHour
      daysOfWeek
      lessonDuration
    }
  }
}
