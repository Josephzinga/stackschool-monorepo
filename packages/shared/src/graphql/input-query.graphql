  searchTerm: String
  sort: SubjectSortInput
  classId: ID
  teacherId: ID
}
input GetAssignmentInput {
  groupId: ID
  classId: ID
  teacherId: ID
  limit: Int

}
input GetSchoolTeachersInput {
  page: Int! = 0
  limit: Int! = 10
  searchTerm: String

  classId: ID
  subjectId: ID
  isActive: Boolean
  isSupervisor: Boolean
}

input GetSchoolClassesInput {
  page: Int! = 0
  limit: Int! = 10
  level: String
