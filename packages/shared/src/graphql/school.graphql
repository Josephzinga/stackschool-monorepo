union Member = Student | Teacher | Staff | Parent

type ClassTeacher {
  schoolId: ID
  teacher: [Teacher]
  groups: [Group!]
  classes: [Class]
}

type TeachingTeamMember {
  teacher: Teacher!
  assignments: [SubjectAssignments!]!
}
type SubjectAssignments {
  id: ID!
  subject: Subject!
}

type MonthlyStats {
  month: String!
  count: Int!
}
