query GetSchoolClasses($input: GetSchoolClassesInput!) {
  getSchoolClasses(input: $input) {
    meta {
      limit
      totalPages
      total
    }

    data {
      ...ClassListFragment
    }
  }
}
fragment ClassListFragment on Class {
  id
  name
  section
  level
  supervisor {
    id
    user {
      id
      email
      username
      phoneNumber
      profile {
        id
        lastname
        firstname
        photo
      }
    }
  }
  _count {
    students {
      male
      female
    }
    teachers
    subjects
  }
}

query GetClassDetails($id: ID!) {
  class(id: $id) {
    id
    name
    level
    section
    group {
      id
      type
    }
    supervisor {
      id
      user {
        email
        phoneNumber
        profile {
          firstname
          lastname
          photo
        }
      }
    }
    _count {
      students {
        male
        female
      }
      subjects
      teachers
    }
  }
}

query GetClassStudents($classid: ID!) {
  class(id: $classid) {
    students {
      id
      matricule
      user {
        profile {
          firstname
          lastname
          photo
          gender
        }
      }
    }
  }
}

query GetClassSubjectTable($classId: ID!) {
  class(id: $classId) {
    group {
      classSubjects {
        id
        coefficient
        weeklyHours
        subject {
          id
          name
          code
        }
        teacher {
          id
          user {
            profile {
              firstname
              lastname
            }
          }
        }
      }
    }
  }
}

query GetTeachersTeam($id: ID!) {
  class(id: $id) {
    group {
      classSubjects {
        ...SubjectWithTeacher
      }
    }
  }
}
fragment SubjectWithTeacher on ClassSubject {
  id
  coefficient
  weeklyHours
  teacher {
    id
    user {
      ...UserProfile
    }
  }
  subject {
    id
    name
    code
  }
}
fragment UserProfile on User {
  id
  email
  profile {
    firstname
    lastname
    photo
  }
}

mutation CreateClass($data: CreateClassInput!) {
  createClass(data: $data) {
    ...ClassListFragment
  }
}
query GetClassAndSubjects($input: StudentSearchInput) {
  getClassAndSubjects(filter: $input) {
    id
    name
    level
    section
    subjects {
      id
      name
      code
    }
  }
}
query GetClassesOptions($input: GetSchoolClassesInput!) {
  getSchoolClasses(input: $input) {
    data {
      id
      level
      name
      section
    }
  }
}


mutation UpdateClass($classId: ID!, $data: CreateClassInput!, $schoolId: ID!) {
  updateClass(classId: $classId, data: $data, schoolId: $schoolId) {
    ok
    message
  }
}

mutation DeleteClasses($classIds: [ID!]!, $schoolId: ID!) {
  deleteClasses(classIds: $classIds, schoolId: $schoolId) {
    ok
    message
  }
}

mutation CreateClassSubject($input: ClassSubjectInput) {
  createClassSubject(input: $input) {
    ...SubjectWithTeacher
  }
}

mutation UpdateClassSubject($input: ClassSubjectInput) {
  updateClassSubject(input: $input) {
    ...SubjectWithTeacher
  }
}

mutation DeleteClassSubjects($ids: [ID!]!) {
  deleteClassSubjects(ids: $ids) {
    ok
    message
  }
}
