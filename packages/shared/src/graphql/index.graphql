type Mutation {
  confirmCompleteProfile: UserPayload
  createListTeachers(data: CreateTeacherInput, schoolId: ID!): ApiResponse
  deleteTeachers(teacherIds: [ID!]!, schoolId: ID!): ApiResponse
}

scalar DateTime

type ApiResponse {
  ok: Boolean
  message: String
}

type Query {
  searchStudent(filter: StudentSearchInput!): [Student]
  searchSchool(filter: SchoolSearchInput!): [School!]
  getClassSubjects(filter: StudentSearchInput!): [Classe]
  me: User
  school(schoolId: SchoolId!): School!
  verifyInvitationCode(code: InvitationCodeInput!): User

  teacher(id: ID!): Teacher

  getSchoolTeachers(
    schoolId: SchoolId!
    page: Int = 0
    limit: Int = 10
    searchTerm: String

    classId: ID
    specialization: String
    isActive: Boolean
    isSupervisor: Boolean
  ): TeacherList!

  getSchoolStudents(
    schoolId: ID!
    page: Int = 0
    limit: Int = 10
    classId: String
    searchTerm: String
  ): StudentList!


  getSchoolClasses(
    schoolId: ID!
    page: Int = 0
    limit: Int = 10
    searchTerm: String
  ): ClassList!
}
