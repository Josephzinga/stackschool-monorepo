enum SchoolRole {
  ADMIN
  TEACHER
  STUDENT
  PARENT
  STAFF
}
input Role {
  role: SchoolRole
}

input CreateInvitationInput {
  schoolId: ID!
  role: SchoolRole
  email: String
  phoneNumber: String
  message: String!

}



type UserPayload {
  ok: Boolean
  message: String
  user: User
}

input InvitationCodeInput {
  code: String!
}
