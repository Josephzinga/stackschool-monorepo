type Permission @key(fields: "id") {
  id: ID!
  code: PermissionCode
  module: PermissionModule
  name: String
  description: String
  createdAt: DateTime
  updatedAt: DateTime

  user: User
}

type SchoolMembership @key(fields: "id") {
  id: ID!
  role: SchoolRole!
  schoolId: ID
  school: School
  permissions: [Permission]
  member: Member
  user: User
  teacher: Teacher
  student: Student
  parent: Parent
  staff: Staff
}

union Member = Teacher | Student | Parent | Staff
