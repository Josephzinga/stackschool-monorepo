query GetSchoolLessons($filter: GetLessonsInput!) {
  getLessons(filter: $filter) {
    meta {
      page
      totalPages
      total
      limit
    }
    data {
      resources {
        id
        title
      }
     events {
       id
       resourceId
       status
       startTime
       endTime
       group {
         id
         name
         type
         classes {
           id
           name
         }
       }
       subject {
         id
         name
       }
       teacher {
         id
         user {
           profile {
             firstname
             lastname
           }
         }
       }
     }
    }
  }
}
query GetNavigationData {
  getClassTeacher {
    class {
      id
      name
      level
      section
    }
    teacher {
      id
      department
      user {
        ...UserProfile
      }
    }
  }
}
mutation CreateLesson($input: CreateLessonInput!) {
  createLesson(input: $input) {
    id
    status
    startTime
    endTime
    day
    classSubject {
      id
      subject {
        id
        name
        code
      }
      group {
        classes {
          name
          level
        }
      }
      teacher {
        id
        user {
          profile {
            firstname
            lastname
          }
        }
      }
    }
  }
}

mutation UpdateLessonStatus($status: LessonStatus!, $id: ID!) {
  updateLessonStatus(status: $status, id: $id) {
    id
    status
  }
}

mutation UpdateLesson($input: UpdateLessonInput!) {
  updateLesson(input: $input) {
    id
    status
    startTime
    endTime
    day
  }
}

mutation DeleteLesson($id: ID!) {
  deleteLesson(id: $id) {
    ok
    message
    details
  }
}
