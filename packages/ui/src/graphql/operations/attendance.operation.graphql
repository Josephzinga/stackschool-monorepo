mutation MarkAttendance($input: [MarkAttendanceInput!]) {
  markAttendance(input: $input) {
    id
    date
    checkInTime
    status
    recordedBy {
      id
      schoolProfile {
        firstName
        lastName
      }
    }
    member {
      ... on Student {
        id
        schoolClass {
          name
        }
        schoolProfile {
          firstName
          lastName
        }
      }
      ... on Teacher {
        id
        schoolProfile {
          firstName
          lastName
        }
      }
    }
  }
}

query GetStudentForAttendance(
  $input: GetSchoolStudentsInput!
  $date: DateTime
) {
  getSchoolStudents(input: $input) {
    meta {
      limit
      total
      totalPages
    }
    data {
      id
      schoolProfile {
        firstName
        lastName
        avatarUrl
      }
      schoolClass {
        id
        name
      }
      attendances(date: $date) {
        id
        status
        checkInTime
        date
      }
    }
  }
}
query GetTeacherForAttendance(
  $input: GetSchoolTeachersInput!
  $date: DateTime
) {
  getSchoolTeachers(input: $input) {
    meta {
      total
      totalPages
      limit
    }
    data {
      id
      schoolProfile {
        firstName
        lastName
        avatarUrl
      }
      attendances(date: $date) {
        status
      }
      assignments {
        classSubject {
          subject {
            id
            name
          }
          group {
            classes {
              id
              name
            }
          }
        }
      }
    }
  }
}
