enum Relation {
   FATHER
   MOTHER
   GUARDIAN
   UNCLE
   OTHER
   GRAND_MOTHER
   GRAND_FATHER
   AUNT
}
enum ContactPreference {
   WHATSAPP
   EMAIL
   PHONE
}
type Student {
   id: ID!,
   firstname: String!,
   lastname: String!,
   photo: String,
   matricule: String!,
   className: String!
}

type School {
   id: ID,
   name: String!,
   slug: String
   address: String!
   code: String
   logo: String
}

type Subject {
   id: ID!
   name: String!
   code: String
}

input SchoolSearchInput {
   searchTerm: String
}

input StudentSearchInput {
   schoolId: ID!,
   searchTerm: String
   getOnly: Boolean
}

input ChildInput {
   studentId: ID!
   relation: Relation
}

type Classes {
   id: ID!,
   name: String!,
   level: String!,
   section: String
   subjects: [Subject]
}

type Query {
   searchStudent(filter: StudentSearchInput!): [Student]
   searchSchool(filter: SchoolSearchInput!): [School!]
   getClassSubjects(filter: StudentSearchInput!): [Classes]
}
