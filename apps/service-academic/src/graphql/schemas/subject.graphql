type Subject @key(fields: "id") {
  id: ID!
  name: String!
  code: String
  category: SubjectCategory
  totalWeeklyHours: Float
  mainTeacherId: ID
  classSubjects: [ClassSubject]
}
input GetSubjectInput {
  page: Int! = 0
  limit: Int! = 10
  searchTerm: String
  classId: ID
  teacherId: ID
}
input CreateSubjectInput {
  name: String!
  code: String!
  mainTeacherId: ID
  category: SubjectCategory!
  classSubjects: [ClassSubjectInput!]
}
type SubjectList {
  data: [Subject!]!
  meta: PaginationMeta!
}

input DeleteSubjectsInput {
  subjectIds: [ID!]!
  soft: Boolean! = true
}
