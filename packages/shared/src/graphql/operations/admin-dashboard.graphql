query GetAdminDashboardStats($schoolId: ID!) {
  school(schoolId: $schoolId) {
    id
    name
    logo
    stats {
      totalStudents
      totalTeachers
      totalClasses

      monthlyRevenue {
        previousMonth
        currentMonth
      }
      pendingPaymentsCount

      attendance {
        rate
        presentCount
        absentCount
        totalExpected
        lateCount
        history {
          date
          rate
          present
          absent
          late
        }
      }

      studentGender {
        male
        female
      }

      classesOccupancy {
        className
        studentCount
      }

      enrollmentPerMonth {
        month
        count
      }
    }
  }
}
query GetSchoolSettings($schoolId: ID!) {
   school(schoolId: $schoolId) {
     settings {
       id
       startHour
       endHour
       daysOfWeek
       lessonDuration
     }
   }
}