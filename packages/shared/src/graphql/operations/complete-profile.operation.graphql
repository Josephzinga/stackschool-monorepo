query SearchStudent($input: StudentSearchInput!) {
  searchStudent(filter: $input) {
    id
    user {
      profile {
        firstname
        lastname
        photo
      }
    }
    schoolClass {
      name
    }
    matricule
  }
}

query SearchSchool($input: SchoolSearchInput!) {
  searchSchool(filter: $input) {
    id
    name
    address
    code
    logo
  }
}



mutation ConfirmCompleteProfile {
  confirmCompleteProfile {
    ok
    message
    user {
      id
      email
      profileCompleted
      hasMembership
    }
  }
}
query GetMe {
  me {
    id
    username
    phoneNumber
    email
    profileCompleted
    hasMembership

    profile {
      id
      address
      firstname
      lastname
      gender
      photo
    }
    memberships {
      id
      role
      school {
        id
        name
        logo
        slug
        address
      }
    }
  }
}

query GetDashboardContext($input: SchoolId!) {
  me {
    schoolContext(schoolId: $input) {
      id
      role
      teacher {
        id
        department
        specialization
        supervisedClasses {
          id
          section
          section
        }
      }
      staff {
        id
        position
        departement
        schoolUserId
      }
      parent {
        id
        isDelegate
        parentStudent{
         student {
           id
           user {
             id
             profile {
               lastname
               firstname
               photo
             }
           }
           matricule
         }
        }
      }
      student {
        id
        user {
          id
          profile {
            id
            firstname
            lastname
            photo
          }
        }
        matricule
      }
    }
  }
}
