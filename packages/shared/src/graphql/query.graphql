type Query {
  searchStudent(filter: StudentSearchInput!): [Student!]
  searchSchool(filter: SchoolSearchInput!): [School!]
  getClassSubjects(
    classId: ID
    teacherId: ID
    groupId: ID
    searchTerm: String
  ): [ClassSubject!]
  getAssignments(filter: GetAssignmentInput!): [TeacherAssignments!]
  me: User

  verifyInvitationCode(code: InvitationCodeInput!): User
  getLessons(filter: GetLessonsInput!): LessonsList

  teacher(id: ID!): Teacher
  student(id: ID!): Student
  class(id: ID!): Class
  getSchoolTeachers(input: GetSchoolTeachersInput!): TeacherList!
  getSchoolStudents(input: GetSchoolStudentsInput!): StudentList!

  getSchoolClasses(input: GetSchoolClassesInput!): ClassList!

  getSchoolSubjects(input: GetSubjectInput!): SubjectList
  getTeachersForAttendance(
    filter: GetTeacherForAttendanceInput!
  ): [TeacherTodaySubject]

  getSchoolRooms(filter: GetSchoolRoomInput!): RoomList!
  getSchoolParents(filter: GetSchoolParentsInput!): ParentList
}

type TeacherTodaySubject {
  teachers: Teacher
  classes: ClassLessons
}

type ClassLessons {
  classSubject: ClassSubject
  lesson: Lesson
}
