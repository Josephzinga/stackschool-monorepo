scalar Date
scalar DateTime

type AttendanceStats {
  rate: Float!
  presentCount: Int!
  absentCount: Int!
  lateCount: Int!
  totalExpected: Int!
  history: [DailyAttendance!]
}
type DailyAttendance {
  date: DateTime!
  rate: Float!
  present: Int!
  absent: Int!
  late: Int!
}

input MarkAttendanceInput {
  id: String!
  classId: String
  status: AttendanceStatus!
  date: DateTime!
  userType: SchoolRole!
  isSubjectMode: Boolean! = false
  subjectId: String
}

input MarkEmployeeAttendanceInput {
  schoolUserId: String!
  status: AttendanceStatus!
  date: DateTime
}

input GetTeacherForAttendanceInput {
  search: String
  day: Day
  page: Int! = 0
  limit: Int! = 10

  attendanceDate: DateTime
}

input GenerateSessionInput {
  targetRole: String! # TEACHER ou STAFF
  durationMinutes: Int # par défaut 10
}

type AttendanceSessionPayload {
  sessionId: String!
  qrCodeDataUrl: String!
  secretCode: String!
  expiresAt: DateTime!
}

type AttendanceRecord @key(fields: "id recordedById") {
  id: ID!
  status: AttendanceStatus
  date: DateTime
  checkInTime: DateTime
  recordedById: ID!
  type: AttendanceType
}
