union Member = Student | Teacher | Staff | Parent

type StudentDisciplinaryAction {
  id: String
  studentId: ID
  type: DisciplinaryType
  reason: String
  startDate: DateTime
  endDate: DateTime
}

type Subject {
  id: ID!
  name: String!
  code: String
  category: SubjectCategory
  totalWeeklyHours: Float
  mainTeacherId: ID
  mainTeacher: Teacher
  classSubject: [ClassSubject]
}
type Room {
  id: ID!
  name: String!
  code: String
  capacity: Int
  type: String
  class: [Class]
  defaultForClass: Class
}

type ClassSubject {
  id: ID!
  coefficient: Int
  weeklyHours: Float
  teacherId: ID
  subjectId: ID
  groupId: ID!
  subject: Subject!
  assignment: TeacherAssignments
  group: Group!
  assessments: [Assessment!]
}

type Assessment {
  id: ID!
  type: AssessmentType
  description: String
  status: AssessmentStatus
  weight: Float
  maxScore: Float
}
type Lesson {
  id: ID!
  title: String
  startTime: DateTime
  endTime: DateTime
  day: Day
  teacherAssignmentId: ID!
  teacherAssignment: TeacherAssignments
  status: LessonStatus!
  room: Room
}
type ClassTeacher {
  schoolId: ID
  teacher: [Teacher]
  groups: [Group!]
  classes: [Class]
}

type TeachingTeamMember {
  teacher: Teacher!
  assignments: [SubjectAssignments!]!
}
type SubjectAssignments {
  id: ID!
  subject: Subject!
}

enum GroupType {
  SOLO
  MULTIPLE
}
type Group {
  id: ID!
  name: String!
  type: GroupType
  classes: [Class!]!
  classSubjects: [ClassSubject]
}

type ClassCount {
  students: GenderStats
  teachers: Int
  subjects: Int
}

type MonthlyStats {
  month: String!
  count: Int!
}

type ClassStats {
  className: String!
  studentCount: Int!
}

type DailyAttendance {
  date: String!
  rate: Float!
  present: Int!
  absent: Int!
  late: Int!
}

input SubjectSortInput {
  field: SubjectSortField
  order: SortOrder
}

input CreateSubjectInput {
  name: String!
  code: String!
  mainTeacherId: ID
  category: SubjectCategory!
  classSubject: [ClassSubjectInput!]
}

input CreateRoomInput {
  id: ID
  name: String!
  capacity: Int
  type: String
  code: String
  defaultClassId: String
}

input CreateGroupInput {
  name: String!
  classIds: [ID!]!
}

input ClassSubjectInput {
  id: ID
  teacherId: ID
  groupId: ID
  classId: ID
  subjectId: ID!
  coefficient: Int!
  weeklyHours: Float
}

type RoomList {
  data: [Room]!
  meta: PaginationMeta
}
