query GetSchoolParents($filter: GetSchoolParentsInput!) {
  getSchoolParents(filter: $filter) {
    meta {
      page
      total
      totalPages
      limit
    }
    data {
      ...ParentList
    }
  }
}

mutation CreateParent($input: CreateParentInput!) {
  createParent(input: $input) {
    ...ParentList
  }
}

mutation UpdateParent($input: UpdateParentInput!) {
  updateParent(input: $input) {
    ...ParentList
  }
}

mutation CreateParentStudent($input: [CreateParentStudentInput!]) {
  createParentStudent(input: $input) {
    id
    relationType
    student {
      id
    }
  }
}


fragment ParentList on Parent {
  id
  profession
   schoolProfile {
     firstName
     lastName
     address
     avatarUrl
     gender
   }
  member {
    user {
      id
      email
      phoneNumber
    }
  }
  parentStudent {
    relationType
    student {
      id
      schoolProfile {
        firstName
        lastName
        avatarUrl
      }
      schoolClass {
        id
        name
      }
    }
  }
}
