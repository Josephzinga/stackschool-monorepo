type Profile {
  id: ID!
  firstname: String
  lastname: String
  photo: String
  gender: String
  address: String
}

scalar SchoolId

type Permission {
  id: ID
  code: PermissionCode
  module: PermissionModule
  name: String
  description: String
  createdAt: DateTime
  updatedAt: DateTime

  user: User
}

type SchoolMembership {
  id: ID!
  role: SchoolRole!
  schoolId: ID
  school: School
  permissions: [Permission]

  # Données spécifiques au rôle
  teacher: Teacher
  student: Student
  parent: Parent
  staff: Staff
}

type User {
  id: ID!
  email: String
  username: String
  phoneNumber: String
  profileCompleted: Boolean
  hasMembership: Boolean
  profile: Profile
  isActive: Boolean
  # Liste de toutes les écoles
  memberships: [SchoolMembership]

  # Contexte spécifique à une école
  schoolContext(schoolId: SchoolId): SchoolMembership
}
