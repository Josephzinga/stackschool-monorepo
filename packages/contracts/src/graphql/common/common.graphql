extend schema
  @link(
    url: "https://specs.apollo.dev/federation/v2.3"
    import: ["@key", "@shareable", "@external", "@provides"]
  )
type ApiResponse @shareable {
  ok: Boolean
  message: String
  details: [String]
}
type PaginationMeta @shareable {
  total: Int!
  page: Int!
  limit: Int!
  totalPages: Int!
}
type GenderStats @shareable {
  male: Int!
  female: Int!
}
