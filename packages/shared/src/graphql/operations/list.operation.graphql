query GetSchoolTeachers(
  $schoolId: SchoolId!
  $page: Int
  $limit: Int
  $searchTerm: String
  $classId: ID
  $specialization: String
  $isActive: Boolean
  $isSupervisor: Boolean
) {
  getSchoolTeachers(
    schoolId: $schoolId
    page: $page
    limit: $limit
    searchTerm: $searchTerm

    classId: $classId
    specialization: $specialization
    isActive: $isActive
    isSupervisor: $isSupervisor
  ) {
    meta {
      limit
      total
      totalPages
    }
    data {
      id
      schoolUserId
      supervisedClasses {
        id
        name
        level
      }
      weeklyHours
      specialization
      departement
      experience
      isActive
      user {
        email
        phoneNumber
        profile {
          firstname
          lastname
          photo
        }
      }
      classes {
        id
        name
      }
    }
  }
}



