type Student {
  id: ID!
  matricule: String!
  birthDate: DateTime
  birthPlace: DateTime
  schoolUserId: ID
  enrollmentDate: DateTime
  previousClass: String
  studentNumber: Int

  bloodGroup: String
  birthCertificateNumber: String
  medicalCondition: String
  allergies: String

  transportMode:  TransportMode
  previousSchool: String
  enrollmentYear: String!
  status: StudentStatus
  disciplinaryActions: StudentDisciplinaryAction
  nationality: String
  schoolClass: Class
  classId: ID
  profileId: ID
  profile: Profile
  parents: [Parent]
  user: User
}

type StudentDisciplinaryAction {
  id: String
  studentId: ID
  type: DisciplinaryType
  reason: String
  startDate: DateTime
  endDate: DateTime
}
enum DisciplinaryType {
  SUSPENSION
  EXPULSION
  WARNING
}
enum StudentStatus {
  ACTIVE
  SUSPENDED
  EXPELLED
  TRANSFERRED
  DROPPED_OUT
  GRADUATED
  INACTIVE
  DECEASED
}
enum Day {
  MONDAY
  TUESDAY
  WEDNESDAY
  THURSDAY
  FRIDAY
  SATURDAY
  SUNDAY
}

type School {
  id: ID
  name: String!
  slug: String
  address: String!
  code: String
  logo: String
  stats: SchoolStats
  settings: SchoolSettings
  teachers: [Teacher]
  lessons: [Lesson]
}

type SchoolSettings {
  id: ID
  schoolId: ID
  lessonDuration: Int
  startHour: Int
  endHour: Int
  daysOfWeek: [Day]
}

type Subject {
  id: ID!
  name: String!
  code: String
  category: SubjectCategory
  totalWeeklyHours: Float
  mainTeacherId: ID
  mainTeacher: Teacher
  classSubject: [ClassSubject]
}
type Room {
  id: ID!
  name: String!
  code: String
  capacity: Int
  type: String
  class: [Class]
  defaultForClass: Class
}

type ClassSubject {
  id: ID!
  coefficient: Int
  weeklyHours: Float
  teacherId: ID
  subjectId: ID
  groupId: ID!
  subject: Subject
  teacher: Teacher
  group: Group
  lessons: [Lesson!]
  assessments: [Assessment!]
}
type Parent {
  id: ID!
  profession: String
  isDelegate: Boolean
  students: [Student]
  relationType: String
  schoolUserId: ID
  user: User
}
type Assessment {
  id: ID!
  type: AssessmentType
  description: String
  status: AssessmentStatus
  weight: Float
  maxScore: Float
}
type Lesson {
  id: ID!
  title: String
  startTime: DateTime
  endTime: DateTime
  day: Day
  classSubject: ClassSubject!
  status: LessonStatus!
  room: Room
}

enum LessonStatus {
  PLANNED
  ONGOING
  COMPLETED
  CANCELLED
  POSTPONED
}
type Teacher {
  id: ID
  schoolUserId: ID
  diploma: String
  experience: String
  hireDate: DateTime
  isActive: Boolean
  bio: String
  salary: Float
  departement: String
  specialization: String
  lessons: [Lesson]
  classSubjects: [ClassSubject]
  supervisedClasses: [Class]
  createdAt: DateTime
  updatedAt: DateTime

  weeklyHours: Float

  user: User
}

type Staff {
  id: ID!
  schoolUserId: String!
  position: String!
  hireDate: DateTime
  salary: Float
  departement: String
}

type Class {
  id: ID!
  name: String!
  level: String!
  section: String
  subjects: [Subject]
  lessons: [Lesson]
  students: [Student!]
  defaultRoom: Room
  groupId: ID!
  group: Group
  supervisor: Teacher
  teachers: [Teacher]
  _count: ClassCount
}

type Group {
  id: ID!
  name: String!
  type: String!
  classes: [Class!]!
  classSubjects: [ClassSubject]
}

type ClassCount {
  students: GenderStats
  teachers: Int
  subjects: Int
}

type GenderStats {
  male: Int!
  female: Int!
}

type MonthlyStats {
  month: String!
  count: Int!
}

type ClassStats {
  className: String!
  studentCount: Int!
}

type DailyAttendance {
  date: String!
  rate: Float!
  present: Int!
  absent: Int!
  late: Int!
}

type MonthlyRevenue {
  currentMonth: Float!
  previousMonth: Float
}

type AttendanceStats {
  rate: Float!
  presentCount: Int!
  absentCount: Int!
  lateCount: Int!
  totalExpected: Int!
  history: [DailyAttendance!]
}

type SchoolStats {
  # KPI Cards
  totalStudents: Int!
  totalTeachers: Int!
  totalClasses: Int!

  # Finance & Présence
  monthlyRevenue: MonthlyRevenue
  pendingPaymentsCount: Int

  # Remplacé par un objet complexe
  attendance: AttendanceStats

  # Charts Data
  studentGender: GenderStats
  enrollmentPerMonth: [MonthlyStats!]
  classesOccupancy: [ClassStats!]
}

enum SortOrder {
  ASC
  DESC
}
enum StudentSortField {
  firstname
  lastname
  enrolementYear
}

enum SubjectSortField {
  coefficient
  name
  ponderation
}
input StudentSortInput {
  field: StudentSortField
  order: SortOrder
}
input SubjectSortInput {
  field: SubjectSortField
  order: SortOrder
}
input GetSchoolStudentsInput {
  page: Int! = 0
  limit: Int! = 10

  teacherId: String
  sort: StudentSortInput
  classId: ID
  searchTerm: String
  level: String
  section: String
}
input CreateSubjectInput {
  name: String!
  code: String!
  mainTeacherId: ID
  category: SubjectCategory!
  classSubject: [ClassSubjectInput!]
}

input CreateRoomInput {
  id: ID
  name: String!
  capacity: Int
  type: String
  code: String
  defaultClassId: String
}

input CreateGroupInput {
  name: String!
  classIds: [ID!]!
}

input ClassSubjectInput {
  id: ID
  teacherId: ID
  groupId: ID
  subjectId: ID!
  coefficient: Int!
  weeklyHours: Float
}

input GetSchoolTeachersInput {
  page: Int! = 0
  limit: Int! = 10
  searchTerm: String

  classId: ID
  specialization: String
  isActive: Boolean
  isSupervisor: Boolean
}
input GetSchoolClassesInput {
  page: Int! = 0
  limit: Int! = 10
  level: String
  section: String
  teacherId: String
  searchTerm: String
}
input GetSchoolRoomInput {
  page: Int! = 0
  limit: Int! = 10
  classId: String
  teacherId: String
  searchTerm: String
}

type RoomList {
  data: [Room]!
  meta: PaginationMeta
}
enum AssessmentType {
  EXAM
  ASSIGNMENT
  QUIZ
  TEST
  PRACTICAL
  ORAL
}

enum AssessmentStatus {
  DRAFT
  PUBLISHED
  CLOSED
}

enum SubjectCategory {
  SCIENTIFIC
  LITERARY
  GENERAL
  SPORT
}
enum TransportMode {
  BUS
  WALK
  CAR
  MOTO
  TAXI
  PARENT
  OTHER
}