query GetSchoolTeachers($input: GetSchoolTeachersInput!) {
  getSchoolTeachers(input: $input) {
    meta {
      limit
      total
      totalPages
    }
    data {
      ...TeacherListData
    }
  }
}
query GetTeachers($input: GetSchoolTeachersInput) {
  getSchoolTeachers(input: $input) {
    data {
      id
      user {
        profile {
          firstname
          lastname
        }
      }
    }
  }
}

query GetTeacherSchedule($id: ID!) {
  teacher(id: $id) {
      classSubjects {
        group {
          id
          type
          name
          classes {
            id
            name
          }
        }
        subject {
          id
          name
        }
        lessons {
          id
          endTime
          startTime
          status
         day
        }
      }

  }
}

query GetTeacherDetails($id: ID!) {
  teacher(id: $id) {
    id
    specialization
    diploma
    experience
    bio
    hireDate
    salary
    department
    weeklyHours
    isActive
    createdAt
    user {
      id
      email
      phoneNumber
      profile {
        firstname
        lastname
        photo
        gender
        address
      }
    }
    classSubjects {
      id
      group {
        id
        type
        name
        classes {
          id
          name
          level
        }
      }
      subject {
        id
        name
        code
      }
    }
  }
}

mutation DeleteTeachers($teacherIds: [ID!]!, $soft: Boolean) {
  deleteTeachers(teacherIds: $teacherIds, soft: $soft) {
    ok
    message
  }
}

mutation CreateTeacher($input: CreateTeacherInput!) {
  createTeacher(input: $input) {
    ...TeacherListData
  }
}

fragment TeacherListData on Teacher {
  id
  schoolUserId
  supervisedClasses {
    id
    name
    level
  }
  weeklyHours
  specialization
  diploma
  department
  experience
  isActive
  user {
    email
    phoneNumber
    profile {
      firstname
      lastname
      photo
      gender
    }
  }
  classSubjects {
    group {
      type
      classes {
        id
        name
      }

    }
    subject {
      id
      name
    }
  }

}

mutation UpdateTeacher(
  $teacherId: ID!
  $data: CreateTeacherInput!
) {
  updateTeacher( teacherId: $teacherId, data: $data) {
   ...TeacherListData
  }
}
