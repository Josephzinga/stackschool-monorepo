type Subject {
  id: ID!
  name: String!
  code: String
  category: SubjectCategory
  totalWeeklyHours: Float
  mainTeacherId: ID
  mainTeacher: Teacher
  classSubject: [ClassSubject]
}
input SubjectSortInput {
  field: SubjectSortField
  order: SortOrder
}
input GetSubjectInput {
  page: Int! = 0
  limit: Int! = 10
  searchTerm: String
  sort: SubjectSortInput
  classId: ID
  teacherId: ID
}
input CreateSubjectInput {
  name: String!
  code: String!
  mainTeacherId: ID
  category: SubjectCategory!
  classSubject: [ClassSubjectInput!]
}
type SubjectList {
  data: [Subject!]!
  meta: PaginationMeta!
}
