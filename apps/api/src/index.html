<!doctype html>
<html>
  <head>
    <meta content="width=device-width,initial-scale=1.0" name="viewport" />
    <title>Socket.IO chat</title>
    <style>
      body {
        margin: 0;
        padding-bottom: 3rem;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica,
          Arial, sans-serif;
      }

      #form {
        background: rgba(0, 0, 0, 0.15);
        padding: 0.25rem;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        height: 3rem;
        box-sizing: border-box;
        backdrop-filter: blur(10px);
      }
      #input {
        border: none;
        padding: 0 1rem;
        flex-grow: 1;
        border-radius: 2rem;
        margin: 0.25rem;
      }
      #input:focus {
        outline: none;
      }
      #form > button {
        background: #333;
        border: none;
        padding: 0 1rem;
        margin: 0.25rem;
        border-radius: 3px;
        outline: none;
        color: #fff;
      }

      #messages {
        list-style-type: none;
        margin: 0;
        padding: 0;
      }
      #messages > li {
        padding: 0.5rem 1rem;
      }
      #messages > li:nth-child(odd) {
        background: #efefef;
      }
    </style>
  </head>
  <body>
    <ul id="messages"></ul>
    <form action="" id="form">
      <input autocomplete="off" id="input" />
        <button>Send</button>
    </form>

    <script src="./server.ts"></script>
    <script>
        const form = document.querySelector('form');
        const button = document.querySelector('button');
        const input = document.querySelector('input');

      const socket = 'http://localhost:4000';

      socket.onmessage = (e) => {
          console.log("message")
      }

      socket.onopen = (e) => {
          console.log("message from html")
      }
    </script>
  </body>
</html>
