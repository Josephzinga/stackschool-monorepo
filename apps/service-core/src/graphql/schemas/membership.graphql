type Permission @key(fields: "id") {
  id: ID!
  action: PermissionAction!
  subject: PermissionSubject!
  module: PermissionModule!
  name: String!
  description: String
  conditions: JSON
  createdAt: DateTime
  updatedAt: DateTime

}

type SchoolMembership @key(fields: "userId") {
  id: ID!
  role: SchoolRole!
  userId: ID!
  schoolId: ID
  school: School
  isActive: Boolean!
  isOwner: Boolean!
  schoolProfile: SchoolProfile
  permissions: [Permission]
  member: SchoolMember
  teacher: Teacher
  student: Student
  parent: Parent
  staff: Staff
}
input UpdateSchoolUserPermissionsInput {
  schoolUserId: ID!
  grantPermissionIds: [ID]
  revokePermissionIds: [ID]
}
input GetSchoolMembershipsInput {
  id: ID
  searchTerm: String
  limit: Int = 10
}

union SchoolMember = Teacher | Student | Parent | Staff
