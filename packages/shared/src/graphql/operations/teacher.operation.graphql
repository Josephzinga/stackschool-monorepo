query GetSchoolTeachers($input: GetSchoolTeachersInput!) {
  getSchoolTeachers(input: $input) {
    meta {
      limit
      total
      totalPages
    }
    data {
      id
      schoolUserId
      supervisedClasses {
        id
        name
        level
      }
      weeklyHours
      specialization
      diploma
      departement
      experience
      isActive
      user {
        email
        phoneNumber
        profile {
          firstname
          lastname
          photo
          gender
        }
      }
      classSubjects {
        group {
          classes {
            id
            name
          }
        }
        subject {
          id
          name
        }
      }
    }
  }
}
query GetTeachers($input: GetSchoolTeachersInput) {
  getSchoolTeachers(input: $input) {
    data {
      id
      user {
        profile {
          firstname
          lastname
        }
      }
    }
  }
}

query GetTeacherSchedule($id: ID!) {
  teacher(id: $id) {
      classSubjects {
        group {
          id
          type
          name
          classes {
            id
            name
          }
        }
        subject {
          id
          name
        }
        lessons {
          id
          endTime
          startTime
          status
         day
        }
      }

  }
}

query GetTeacherDetails($id: ID!) {
  teacher(id: $id) {
    id
    specialization
    diploma
    experience
    bio
    hireDate
    salary
    departement
    weeklyHours
    isActive
    createdAt
    user {
      id
      email
      phoneNumber
      profile {
        firstname
        lastname
        photo
        gender
        address
      }
    }
    classSubjects {
      id
      group {
        id
        type
        name
        classes {
          id
          name
          level
        }
      }
      subject {
        id
        name
        code
      }
    }
  }
}

mutation DeleteTeachers($teacherIds: [ID!]!, $schoolId: ID!, $soft: Boolean) {
  deleteTeachers(teacherIds: $teacherIds, schoolId: $schoolId, soft: $soft) {
    ok
    message
  }
}

mutation CreateTeacher($data: CreateTeacherInput!, $schoolId: ID!) {
  createListTeachers(data: $data, schoolId: $schoolId) {
    ok
    message
  }
}

mutation UpdateTeacher(
  $teacherId: ID!
  $schoolId: ID!
  $data: CreateTeacherInput!
) {
  updateTeacher(schoolId: $schoolId, teacherId: $teacherId, data: $data) {
    ok
    message
  }
}
