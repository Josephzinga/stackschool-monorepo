query GetSchoolStudents($input: GetSchoolStudentsInput!) {
  getSchoolStudents(input: $input) {
    meta {
      total
      totalPages
      limit
      page
    }
    data {
      id
      matricule
      enrollmentYear
      user {
        id
        email
        phoneNumber
        profile {
          id
          photo
          firstname
          lastname
          address
        }
      }
      parentStudent {
        relationType
        parent {
          id
        }
      }
      schoolClass {
        id
        name
        section
        level
      }
    }
  }
}

query GetStudentDetails($id: ID!) {
  student(id: $id) {
    ...StudentDetails
  }
}

mutation UpdateStudent(
  $studentId: ID!
  $data: CreateStudentInput!
  $schoolId: ID!
) {
  updateStudent(studentId: $studentId, data: $data, schoolId: $schoolId) {
    ...StudentDetails
  }
}
mutation CreateListStudent($schoolId: ID!, $data: CreateStudentInput!) {
  createListStudent(schoolId: $schoolId, data: $data) {
    ok
    message
  }
}

mutation DeleteStudents($schoolId: ID!, $studentIds: [ID!]!, $soft: Boolean) {
  deleteStudents(schoolId: $schoolId, studentIds: $studentIds, soft: $soft) {
    ok
    message
  }
}
fragment StudentDetails on Student {
  id
  matricule
  enrollmentYear
  birthDate
  birthPlace
  nationality
  status
  previousClass
  previousSchool
  bloodGroup
  allergies
  medicalCondition
  studentNumber
  birthCertificateNumber
  enrollmentDate
  transportMode
  parentStudent {
    relationType
    parent {
      id
      profession
      user {
        phoneNumber
        isActive
        ...UserProfile
        profile {
          address
        }
      }
    }
  }
  schoolClass {
    id
    name
    section
    level
  }
  user {
    id
    phoneNumber
    email
    username
    isActive
    profile {
      id
      firstname
      lastname
      photo
      gender
      address
    }
  }
}
