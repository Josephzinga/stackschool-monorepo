query GetSchoolClasses($input: GetSchoolClassesInput!) {
  getSchoolClasses(input: $input) {
    meta {
      limit
      totalPages
      total
    }

    data {
      ...ClassListFragment
    }
  }
}
fragment ClassListFragment on Class {
  id
  name
  section
  level
  supervisor {
    id
    user {
      id
      profile {
        id
        lastname
        firstname
        photo
      }
    }
  }
  group {
    classSubjects {
      subject {
        id
        name
        code
      }
      assignment {
        teacher {
          id
          user {
            profile {
              lastname
              firstname
            }
          }
        }
      }
    }
  }
  _count {
    students {
      male
      female
    }
    teachers
    subjects
  }
}

query GetClassDetails($id: ID!) {
  class(id: $id) {
    id
    name
    level
    section
    totalCoefficient
    totalWeeklyHours
    group {
      id
      type
    }
    supervisor {
      id
      user {
        email
        phoneNumber
        profile {
          firstname
          lastname
          photo
        }
      }
    }
    _count {
      students {
        male
        female
      }
      subjects
      teachers
    }
  }
}

query GetClassStudents($input: GetSchoolStudentsInput!) {
  getSchoolStudents(input: $input ) {
    meta {
      page
      totalPages
      total
      limit
    }
   data {
     id
     matricule
     status
     studentNumber
     user {
       profile {
         firstname
         lastname
         photo
         gender
       }
     }
   }
  }
}

query getTeachersTeam($classId: ID!) {
  class(id: $classId) {
    id
    teachingTeamMembers {
      teacher {
        id
        user {
          profile {
            firstname
            lastname
            photo
          }
        }
      }
      assignments {
        id
        subject {
          id
          name
          code
        }
      }
    }
  }
}

fragment SubjectWithTeacher on ClassSubject {
  id
  coefficient
  weeklyHours
  assignment {
    id
    teacher {
      id
      user {
        ...UserProfile
      }
    }
  }
  subject {
    id
    name
    code
  }
}
fragment UserProfile on User {
  id
  email
  profile {
    firstname
    lastname
    photo
  }
}

mutation CreateClass($data: CreateClassInput!) {
  createClass(data: $data) {
    ...ClassListFragment
  }
}

query GetClassesOptions($input: GetSchoolClassesInput!) {
  getSchoolClasses(input: $input) {
    data {
      id
      level
      name
      section
      group {
        id
        name
        type
      }
    }
  }
}

mutation UpdateClass($classId: ID!, $data: CreateClassInput!, $schoolId: ID!) {
  updateClass(classId: $classId, data: $data, schoolId: $schoolId) {
    ok
    message
  }
}

mutation DeleteClasses($classIds: [ID!]!, $schoolId: ID!) {
  deleteClasses(classIds: $classIds, schoolId: $schoolId) {
    ok
    message
  }
}

mutation DeleteClassSubjects($ids: [ID!]!) {
  deleteClassSubjects(ids: $ids) {
    ok
    message
  }
}
